[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "banco-agil"
version = "0.1.0"
description = "Atendimento bancário conversacional multiagente do Banco Ágil"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "streamlit>=1.40",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "filelock>=3.16",
    "httpx>=0.27",
    "mlflow>=3.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/banco_agil", "ui"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: testes unitários, sem rede e sem LLM",
    "integration: testes do grafo com modelo falso",
]
